<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2DIMENTIONAL ARRAY</title>
    <script type="text/javascript">
        function disc()
        {
            var arr=[[11,22,33],[44,55,66],[77,88,99]];
            for(var i=0;i<3;i++)
        {
            for(var j=0;j<3;j++)
        {
            document.write("  "+arr[i][j]);
        }
        document.write("<br>");
        }
        }
    </script>
</head>
<body>
    <button onclick="disc()">2D array</button>
</body>
</html>

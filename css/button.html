<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button style</title>
    <style type="text/css">
        button{
            font-size: 30px;
            margin-right: 60px;;
            padding: 15px;
            margin-top: 20px;
            font-family: sans-serif;
            border-radius: 15px;
            background-color: chocolate;
            border: none;
            outline: none;
            color: white;
        }
        #b1:hover{
            outline: 3x solid blue;
            border-radius: 0 25px 0 25px; 
        }
        #b2:hover{
             outline: 3x solid blue;
            border-radius: 25px 0 25px 0;
        }
        button:hover{
            cursor: pointer;
            background-color: darkblue;
        }
    </style>
</head>
<body>
    <button id="b1">Home</button>
    <button id="b2">About</button>
    <button id="b3">Login</button>
    <button id="b4">Sign in</button>
    
</body>
</html>

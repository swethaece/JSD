<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Bootstrap</title>
</head>
<body>
    <button class="btn btn-success">clickme</button>
    <button class="btn btn-danger">clickme</button>
    <button class="btn btn-info">clickme</button>
    <button class="btn btn-primary">clickme</button>
    <button class="btn btn-warning">clickme</button>
    <button class="btn btn-secondary">clickme</button>
    <button class="btn btn-light">clickme</button>
    <button class="btn btn-dark">clickme</button>
    <button class="btn btn-link">clickme</button>
    <br>
    <br>
    <h2>Outline</h2>
     <button class="btn btn-outline-success">clickme</button>
    <button class="btn btn-outline-danger">clickme</button>
    <button class="btn btn-outline-info">clickme</button>
    <button class="btn btn-outline-primary">clickme</button>
    <button class="btn btn-outline-warning">clickme</button>
    <button class="btn btn-outline-secondary">clickme</button>
    <button class="btn btn-outline-light">clickme</button>
    <button class="btn btn-outline-dark">clickme</button>
    <button class="btn btn-outline-link">clickme</button>
    <br>
    <br>
    <h2>Small</h2>
    <button class="btn btn-outline-info">clickme</button>
    <button class="btn btn-outline-primary btn-sm">clickme</button>
    <br>
    <h2>Disable</h2>
    <button class="btn btn-outline-warning">clickme</button>
    <button class="btn btn-outline-secondary" disabled>clickme</button>
    <br>
    <h2><center>Block Button</center></h2>
    <div class="d-grid gap-2">
        <button class="btn btn-success">clickme</button>
        <button class="btn btn-danger">clickme</button>
        <button class="btn btn-info">clickme</button>
        <button class="btn btn-primary">clickme</button>
        <button class="btn btn-warning">clickme</button>
        <button class="btn btn-secondary">clickme</button>
        <button class="btn btn-light">clickme</button>
        <button class="btn btn-dark">clickme</button>
        <button class="btn btn-link">clickme</button>
    </div>
    <br>
    <h2><center>Block Button</center></h2>
    <!--bootstap total column=12 and 20% is 3 column 50% is 6 column-->
    <!--mx is margin horizontel-->
    <div class="d-grid gap-2 col-3 mx-auto">
        <button class="btn btn-success">clickme</button>
        <button class="btn btn-danger">clickme</button>
        <button class="btn btn-info">clickme</button>
        <button class="btn btn-primary">clickme</button>
        <button class="btn btn-warning">clickme</button>
        <button class="btn btn-secondary">clickme</button>
        <button class="btn btn-light">clickme</button>
        <button class="btn btn-dark">clickme</button>
        <button class="btn btn-link">clickme</button>
    </div>
    <h2><center>Group Button</center></h2>
    <div class="btn-group col-2 d-grid mx-auto">
        <button class="btn btn-success">clickme</button>
        <button class="btn btn-danger">clickme</button>
        <button class="btn btn-info">clickme</button>
    </div>
    <br>
    <h2><center>Group Button-Active</center></h2>
    <div class="btn-group">
        <button class="btn btn-info">clickme</button>
        <button class="btn btn-info active">clickme</button>
        <button class="btn btn-info">clickme</button>
    </div>
    <br>
    <h2><center>Check box  -Multiple selection</center></h2>
    <div class="btn-group">
        <input class="btn-check" type="checkbox" id="cb1">
        <label for="cb1" class="btn btn-outline-info">C language</label>
       
         <input class="btn-check" type="checkbox" id="cb2">
        <label for="cb2" class="btn btn-outline-info">C++ language</label>

         <input class="btn-check" type="checkbox" id="cb3">
        <label for="cb3" class="btn btn-outline-info">Java language</label>

         <input class="btn-check" type="checkbox" id="cb4">
        <label for="cb4" class="btn btn-outline-info">Python language</label>
    </div>
</body>
</html>

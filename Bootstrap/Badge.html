<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Badges</title>
</head>
<body>
    <h1><center>Badges</center></h1>
    <h1>This is badge message <span class="badge text-bg-primary">span text</span></h1>
    <h2>This is badge message<span class="badge text-bg-secondary">span text</span></h2>
    <h3>This is badge message<span class="badge text-bg-warning">span text</span></h3>
    <h4>This is badge message<span class="badge text-bg-info">span text</span></h4>
    <button class="btn btn-success">Notificatios
        <span class="badge text-bg-danger">5</span>
    </button>
    <button class="btn btn-success position-relative">Notificatios
        <span class="badge text-bg-danger position-absolute top-0 start-100 translate-middle rounded-pill">5</span>
    </button>
</body>
</html>
